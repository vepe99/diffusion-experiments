#   - "v_los" #override default error keys

masked_value_vlos:
  Pal5:
    mean: -51.76
    std: 137.04
  NGC3201:
    mean: 479.98
    std: 71.38
  M68:
    mean: -95.42
    std: 65.70


gaia_id:
  Pal5: "Pal-5"
  NGC3201: "Gjoll"
  M68: "Fjorm"

augmentations:
  - "remove_los_velocity"
  - "convert_distance_to_parallax"
  - "observational_window"
  - "observed_n_stars"
  - "sample_magnitudes"
  - "sample_obs_error"
  - "apply_obs_error"
  - "flip_dirz"
  - "concatentate_sigma_error_to_sim_data"
  - "concatenate_magnitudes_to_sim_data"
