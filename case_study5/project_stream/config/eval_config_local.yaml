base_dir: "/export/home/vgiusepp/diffusion-experiments/case_study5/project_stream/data/"
data_dir: "streams/data_multistream_streamax/"
model_dir: "models/local_models/model_local_new_streamax_concatenation_500_hyper/"
multistream_n_simulation: 333
results_dir: "plots/plots_local/plots_local_new_streamax_concatenation_500_hyper_333tests/"
use_streamax_simulator: True

#training hyperparameters
n_samples: 1_000
method: "two_step_adaptive"
steps: "adaptive"
max_steps: 1000
mini_batch_size: null
batch_size: 10
inverse_compositional_bridge_d1: 6
noise_schedule: null
  # min_log_snr: -15
  # max_log_snr: 15
  # shift: 10
  # weighting: "sigmoid"
verbose: 2

#nmes of parameters
sim_data: "sim_data_projected"
inference_conditions:
  - "j"
parameters_global:
  - "m_Triaxial_rotated_halo"
  - "r_Triaxial_rotated_halo"
  - "dirx_Triaxial_rotated_halo"
  - "diry_Triaxial_rotated_halo"
  - "dirz_Triaxial_rotated_halo"
  - "m_disk_MW2014"
  - "r_disk_MW2014"
  - "m_bulge"
parameters_local:
  # - "m_progenitor"
  # - "a_progenitor"
  - "vr"
  - "r"
  - "mu_ra_cosdec"
  - "mu_dec"
#names for printing
paramater_global_pretty:
  - "$M_{NFW}$"
  - "$r_{NFW}$"
  - "$\\hat{x}_{NFW}$"
  - "$\\hat{y}_{NFW}$"
  - "$\\hat{z}_{NFW}$"
  - "$M_{MN}$"
  - "$r_{MN}$"
  - "$M_{bulge}$"

parameter_local_pretty:
  # - "$M_{prog}$"
  # - "$a_{prog}$"
  - "$v_r$"
  - "$r$"
