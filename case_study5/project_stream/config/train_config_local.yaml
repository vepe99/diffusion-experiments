base_dir: "/export/home/vgiusepp/diffusion-experiments/case_study5/project_stream/data/"
data_dir: "streams/data_gala/"
N_simulations: 300_000
results_dir: "hyperparameter_tuning/gala/local/new_aug_jonas_300k_200epoch/streamnorm_standardize/model_79"
test: False

#training hyperparameters
n_epochs: 10000
batch_size: 1024
learning_rate: 0.01
weight_decay: 0.0001 #not used
lr_scheduler_step_size: 10 #not used
lr_scheduler_gamma: 0.1 #not used
verbose: 2

#nmes of parameters
sim_data: "sim_data_projected"
inference_conditions:
  - "j"
parameters_global:
- m_Triaxial_halo
- r_Triaxial_halo
- q2_Triaxial_halo
- rho_thin_disk
- hr_thin_disk
- hz_thin_disk
- rho_thick_disk
- hr_thick_disk
- hz_thick_disk
parameters_local:
- vr
- r
- mu_ra_cosdec
- mu_dec
paramater_global_pretty:
- $M_{NFW}$
- $r_{NFW}$
- $q_{NFW}$
- $\\rho_t$
- $h_t$
- $z_t$
- $\\rho_k$
- $h_k$
- $z_k$
parameter_local_pretty:
- $v_r$
- $r$
- $\mu_{\alpha*}$
- $\mu_{\delta}$

# Augmentations
target_streams:
  Pal5: 0 #this is the j index
  NGC3201: 1
  M68: 2

observational_window:
  Pal5:
    ra_min: 220.98008280733634
    # ra_max: 245.89465019770668
    ra_max: 250.0
    # dec_min: -10.644267714585839
    dec_min: -13.0
    # dec_max: 9.279576254116762
    dec_max: 10.0
  NGC3201:
    ra_min: 42.29847920913508
    # ra_max: 178.36142433209437
    ra_max: 140.0
    dec_min: -47.79545565626234
    dec_max: 20.812029301121846
  M68:
    ra_min: 189.73694638139526
    # ra_max: 273.48942253688114
    ra_max: 280.0
    dec_min: -47.32109546202406
    # dec_max: 66.52056055901161
    dec_max: 70.0

observed_n_stars:
  Pal5: 129
  NGC3201: 195
  M68: 297

min_star_with_vlos:
  Pal5: 69
  NGC3201: 37
  M68: 29

# error_keys: null #default is ["ra", "dec", "parallax", "mu_ra", "mu_dec"]
error_keys: 
  - "ra"
  - "dec"
  - "parallax"
  - "mu_ra"
  - "mu_dec"
  - "v_los" #override default error keys

masked_value_vlos:
  Pal5:
    mean: -51.76
    std: 137.04
  NGC3201:
    mean: 479.98
    std: 71.38
  M68:
    mean: -95.42
    std: 65.70

gaia_id:
  Pal5: "Pal-5"
  NGC3201: "Gjoll"
  M68: "Fjorm"


augmentations:
- "cut_to_300_particles"
# - "remove_los_velocity"
- convert_distance_to_parallax
# - observational_window
- observational_window_random
# - observed_n_stars
- mask_vlos
- sample_magnitudes
- sample_obs_error
- apply_obs_error
# - flip_dirz
# - concatentate_sigma_error_to_sim_data
- concatenate_magnitudes_to_sim_data
- concatenate_vlos_mask_to_sim_data
- concatenate_j_to_sim_data

#global model network:
global_model:
  dropout: 0.1
  summary_dim: 182
  embed_dims: 67
  num_heads: 2
  mlp_depths: 3
  mlp_widths: 49
  inference_mlp_depth: 3
  inference_mlp_width: 143
  inference_time_embedding_dim: 62

#local model network:
local_model:
  dropout: 0.1
  summary_dim: 122
  embed_dims: 36
  num_heads: 3
  mlp_depths: 3
  mlp_widths: 100
  inference_mlp_depth: 5
  inference_mlp_width: 55
  inference_time_embedding_dim: 20

hydra:
  run:
    dir: ${base_dir}/${results_dir}
