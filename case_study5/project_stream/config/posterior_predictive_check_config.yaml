data_dir: "data_multistream_gala_posterior_predictive_check/model_54_60k_1000epochs_local2/"
simulator: "gala" #odisseo, gala, galax
n_simulations: 500
batch_size: 10

parameters_global:
  - "a"
parameters_local:
  - "a"

pretty_parameters_global:
  - "a"
pretty_parameters_local:
  - "a"

priors_global: #str for the type and a list of values for the parameters of the prior
  #HALO TRIXIAL
  m_Triaxial_halo:
    type: uniform
    prior_parameters: [5.e10, 2.5e12]
  r_Triaxial_halo:
    type: uniform
    prior_parameters: [5.0, 50.0]
  q1_Triaxial_halo:
    type: identity
    prior_parameters: [1.0]
  q2_Triaxial_halo:
    type: uniform
    prior_parameters: [0.5, 1.5]
  #HALO TRIAXIAL ROTATED
  m_Triaxial_rotated_halo:
    type: uniform
    prior_parameters: [1.e11, 1e13]
  r_Triaxial_rotated_halo:
    type: uniform
    prior_parameters: [10.0, 25.0]
  dirx_Triaxial_rotated_halo:
    type: normal
    prior_parameters: [0.0, 1.0]
  diry_Triaxial_rotated_halo:
    type: normal
    prior_parameters: [0.0, 1.0]
  dirz_Triaxial_rotated_halo:
    type: normal
    prior_parameters: [0.0, 1.0]
  #HALO TWOPOWER TRIAXIAL
  rho_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [1.e7, 1.5e8]
  a_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [1.0, 100.0]
  b_TwoPowerTriaxial_halo:
    type: identity
    prior_parameters: [1.0]
  c_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [0.0, 6.0]
  alpha_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [0.0, 2.0]
  beta_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [2.0, 6.0]
  #THIN AND THICK DISK
  rho_thin_disk:
    type: uniform
    prior_parameters: [0.5e9, 2.0e9]
  hr_thin_disk:
    type: normal
    prior_parameters: [2.6, 0.5]
  hz_thin_disk:
    type: normal
    prior_parameters: [0.3, 0.05]
  rho_thick_disk:
    type: uniform
    prior_parameters: [0.0, 1.5e9]
  hr_thick_disk:
    type: normal
    prior_parameters: [2.0, 0.2]
  hz_thick_disk:
    type: normal
    prior_parameters: [0.9, 0.18]
  #Disk in MilkyWay2022
  M_MN3ExpDisk:
    type: identity
    # prior_parameters: [11929250000.0, 190868000000.0] #0.25*4.7717e+10, 4*4.7717e+10
    prior_parameters: [4.7717e+10]
  r_MN3ExpDisk:
    type: identity
    # prior_parameters: [0.65, 10.4] #0.25*2.6, 4*2.6
    prior_parameters: [2.6]
  z_MN3ExpDisk:
    type: uniform
    prior_parameters: [0.075, 1.2] #0.25*0.3, 4*0.3
  #BULGE in MilkyWay2022
  m_bulge_2022:
    type: identity
    prior_parameters: [5.0e9]
  R_bulge_2022:
    type: identity
    prior_parameters: [1.0]
  #NUCLEUS in MilkyWay2022
  m_nucleus:
    type: identity
    prior_parameters: [1.8142e9]
  R_nucleus:
    type: identity
    prior_parameters: [0.0688867]

  #DISK in MW2014
  m_disk_MW2014:
    type: uniform
    prior_parameters: [3.25e10, 13.0e10] #[6.5e10]  #[6.5e10/2, 6.5e10*2]
  r_disk_MW2014:
    type: uniform
    prior_parameters: [1.5, 6.0] #[3.0]
  z_disk_MW2014:
    type: identity
    prior_parameters: [0.28]
  #BULGE in MW2014
