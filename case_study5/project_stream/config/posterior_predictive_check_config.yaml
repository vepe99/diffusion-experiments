    type: uniform
    prior_parameters: [2250682687.532725, 9002730750.1309] #[4501365375.06545/2, 4501365375.06545*2] #[4501365375.06545]
  alpha_bulge:
    type: identity
    prior_parameters: [1.8]
  r_bulge:
    type: identity
    prior_parameters: [1.9]

