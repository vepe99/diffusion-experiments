base_dir: "/export/home/vgiusepp/diffusion-experiments/case_study5/project_stream/data/"
data_dir: "streams/data_multistream_agama/"
model_dir: "hyperparameter_tuning/agama/local/rotationcurve/model_base_250epochs"
multistream_n_simulation: 333
results_dir: "hyperparameter_tuning/agama/local/rotationcurve/model_base_250epochs/nocomposition_333test"
use_streamax_simulator: True

#training hyperparameters
n_samples: 1_000
method: "two_step_adaptive"
steps: "adaptive"
max_steps: 1000
mini_batch_size: null
batch_size: 30
inverse_compositional_bridge_d1: 6
noise_schedule: null
  # min_log_snr: -15
  # max_log_snr: 15
  # shift: 10
  # weighting: "sigmoid"
verbose: 2

#nmes of parameters
sim_data: "sim_data_projected"
inference_conditions:
  - "j"
parameters_global:
  - rho_TwoPowerTriaxial_halo
  - gamma_TwoPowerTriaxial_halo
  - a_TwoPowerTriaxial_halo
  - q_TwoPowerTriaxial_halo
  - r_Disk
  - z_Disk
  - Sigma_Disk
parameters_local:
  # - "m_progenitor"
  # - "a_progenitor"
  - "vr"
  - "r"
  - "mu_ra_cosdec"
  - "mu_dec"
#names for printing
paramater_global_pretty:
  - "$\\rho_{NFW}$"
  - "$\\gamma_{NFW}$"
  - "$a_{NFW}$"
  - "$q_{NFW}$"
  - "$r_{d}$"
  - "$z_{d}$"
  - "$\\Sigma_{d}$"

parameter_local_pretty:
  # - "$M_{prog}$"
  # - "$a_{prog}$"
  - "$v_R$"
  - "$R$"
  - "$\\mu_{\\alpha*}$"
  - "$\\mu_{\\delta}$"

#Augmentations
target_streams:
  Pal5: 0 #this is the j index
  NGC3201: 1
  M68: 2

