hydra:
  run:
    dir: ${base_dir}/${data_dir}

odisseo_config: #default values
  N_particles: 1000
  return_snapshots: False
  num_snapshots: 0
  num_timesteps: 1_000
  external_accelerations:
    - PSP_POTENTIAL
    - THIN_MN3_DISK
    - THICK_MN3_DISK
    - TRIAXIAL_NFW_POTENTIAL
  acceleration_scheme: DIRECT_ACC_MATRIX
  softening: 0.01 #in pc
  integrator: DIFFRAX_BACKEND
  fixed_timestep: False
  diffrax_solver: TSIT5
  glorder: 50

galax_config:
  df_type: "FardalStreamDF" #FardalStreamDF, ChenStreamDF, MockStreamGenerator
  n_timesteps: 1000

gala_config:
  df_type: FardalStreamDF
  n_timesteps: 500
  use_prog_potential: true
  n_workers: 32
  N_particles: 1000

streamax_config:
  n_timesteps: 4999
  N_particles: 5000
  type_host: "MW2014"
  unroll: False
  type_method: "Fardal2015"

agama_config:
  N_particles: 1000.0
  n_timesteps: 1000
  n_workers: 32
