augmentations:
# Coordinate transforms
- convert_distance_to_parallax
# Observational selection
- observational_window
# - observational_window_spline
- observed_n_stars
- compact_to_attended
# Photometric augmentation
- sample_magnitudes
- sample_obs_error
- apply_obs_error
# v_los masking
- mask_vlos
# Feature concatenations
- concatentate_sigma_error_to_sim_data
- concatenate_magnitudes_to_sim_data
- concatenate_vlos_mask_to_sim_data
- concatenate_j_to_sim_data

# error_keys: null #default is ["ra", "dec", "parallax", "mu_ra", "mu_dec"]
error_keys:
- ra
- dec
- parallax
- mu_ra
- mu_dec
- v_los

#global model network:
global_model:
  dropout: 0.1
  summary_dim: 77
  embed_dims: 105
  num_heads: 7
  mlp_depths: 5
  mlp_widths: 121
  inference_mlp_depth: 7
  inference_mlp_width: 208
  inference_time_embedding_dim: 58

#local model network:
local_model:
  dropout: 0.1
  summary_dim: 16

hydra:
  run:
    dir: ${base_dir}/${results_dir}
