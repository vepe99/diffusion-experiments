base_dir: "/export/home/vgiusepp/diffusion-experiments/case_study5/project_stream/data/"
data_dir: "streams/data_multistream_galax/"
model_dir: "models/model_galax_observational_errors"
multistream_n_simulation: 100
results_dir: "plots/plots_galax_observational_errors"

#training hyperparameters
n_samples: 10_000
method: "two_step_adaptive"
steps: "adaptive"
max_steps: 1000
mini_batch_size: null
batch_size: 10
inverse_compositional_bridge_d1: 3
verbose: 2

#nmes of parameters
sim_data: "sim_data_projected"
inference_conditions:
  - "j"
parameters_global:
  - "m_Triaxial_halo"
  - "r_Triaxial_halo"
  - "q2_Triaxial_halo"
  - "rho_thin_disk"
  - "hr_thin_disk"
  - "hz_thin_disk"
  - "rho_thick_disk"
  - "hr_thick_disk"
  - "hz_thick_disk"
parameters_local:
  - "m_progenitor"
  - "a_progenitor"
  - "vr"
  - "r"
  - "mu_ra_cosdec"
  - "mu_dec"

#names for printing
paramater_global_pretty:
  - "$M_{NFW}$"
  - "$r_{NFW}$"
  - "$q_{NFW}$"
  - "$\\rho_t$"
  - "$h_t$"
  - "$z_t$"
  - "$\\rho_k$"
  - "$h_k$"
  - "$z_k$"
parameter_local_pretty:
  - "$M_{prog}$"
  - "$a_{prog}$"
  - "$v_r$"
  - "$r$"
  - "$\\mu_{\\alpha*}$"
  - "$\\mu_{\\delta}$"

#Augmentations
target_streams:
  Pal5: 0 #this is the j index
  NGC3201: 1
  M68: 2

observational_window:
  Pal5:
    ra_min: 224.65738998670705
    ra_max: 242.09382462115624
    dec_min: -4.800515070822196
    dec_max: 6.883094642923846
  NGC3201:
    ra_min: 42.29847920913508
    ra_max: 178.36142433209437
    dec_min: -47.79545565626234
    dec_max: 20.812029301121846
  M68:
    ra_min: 189.73694638139526
    ra_max: 273.48942253688114
    dec_min: -47.32109546202406
    dec_max: 66.52056055901161

observed_n_stars:
  Pal5: 129
  NGC3201: 607
  M68: 297

gaia_id:
  Pal5: "Pal-5"
  NGC3201: "Gjoll"
  M68: "Fjorm"

augmentations:
  - "remove_los_velocity"
  - "convert_distance_to_parallax"
  - "observational_window"
  - "observed_n_stars"
  - "sample_magnitudes"
  - "sample_obs_error"
  - "apply_obs_error"

#global model network:
global_model:
  dropout: 0.1
  summary_dim: 64
  num_heads: 2

#local model network:
local_model:
  dropout: 0.1
  summary_dim: 16

hydra:
  run:
    dir: ${base_dir}/${results_dir}
