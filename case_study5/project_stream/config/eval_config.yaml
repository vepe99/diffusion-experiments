base_dir: "/export/home/vgiusepp/diffusion-experiments/case_study5/project_stream/data/"
data_dir: "streams/data_multistream_galax/"
model_dir: "models/model_galax"
multistream_n_simulation: 100
results_dir: "plots/plots_galax"

#training hyperparameters
n_samples: 1000
method: "two_step_adaptive"
steps: "adaptive"
max_steps: 1000
mini_batch_size: 3
inverse_compositional_bridge_d1: 3
verbose: 2

#nmes of parameters
sim_data: "sim_data_projected"
inference_conditions:
  - "j"
parameters_global:
  - "m_Triaxial_halo"
  - "r_Triaxial_halo"
  - "q2_Triaxial_halo"
  - "rho_thin_disk"
  - "hr_thin_disk"
  - "hz_thin_disk"
  - "rho_thick_disk"
  - "hr_thick_disk"
  - "hz_thick_disk"
parameters_local:
  - "m_progenitor"
  - "a_progenitor"
  - "vr"
  - "r"
  - "mu_ra_cosdec"
  - "mu_dec"

#names for printing
paramater_global_pretty:
  - "$M_{NFW}$"
  - "$r_{NFW}$"
  - "$q_{NFW}$"
  - "$\\rho_t$"
  - "$h_t$"
  - "$z_t$"
  - "$\\rho_k$"
  - "$h_k$"
  - "$z_k$"
parameter_local_pretty:
  - "$M_{prog}$"
  - "$a_{prog}$"
  - "$v_r$"
  - "$r$"
  - "$\\mu_{\\alpha*}$"
  - "$\\mu_{\\delta}$"

#global model network:
global_model:
  dropout: 0.1
  summary_dim: 64
  num_heads: 2

#local model network:
local_model:
  dropout: 0.1
  summary_dim: 16

hydra:
  run:
    dir: ${base_dir}/${results_dir}
