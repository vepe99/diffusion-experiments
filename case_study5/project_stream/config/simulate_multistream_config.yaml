target_streams:
  Pal5: 0 #this is the j index
  NGC3201: 1
  M68: 2

hydra:
  run:
    dir: ${base_dir}/${data_dir}

odisseo_config: #default values
  N_particles: 1000
  return_snapshots: False
  num_snapshots: 0
  num_timesteps: 1_000
  external_accelerations:
    - PSP_POTENTIAL
    - THIN_MN3_DISK
    - THICK_MN3_DISK
    - TRIAXIAL_NFW_POTENTIAL
  acceleration_scheme: DIRECT_ACC_MATRIX
  softening: 0.01 #in pc
  integrator: DIFFRAX_BACKEND
  fixed_timestep: False
  diffrax_solver: TSIT5
  glorder: 50

galax_config:
  df_type: "ChenStreamDF" #FardalStreamDF, ChenStreamDF, MockStreamGenerator
  n_timesteps: 1000

gala_config:
  df_type: "ChenStreamDF" #FardalStreamDF, ChenStreamDF, MockStreamGenerator
  n_timesteps: 1000
  use_prog_potential: True
