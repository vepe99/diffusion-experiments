base_dir: "/export/home/vgiusepp/diffusion-experiments/case_study5/project_stream/data/streams"
data_dir: "data_multistream_galax"
simulator: "galax" #odisseo, gala, galax
n_simulations: 1000
batch_size: 200

parameters_global:
  - "a"
parameters_local:
  - "a"

pretty_parameters_global:
  - "a"
pretty_parameters_local:
  - "a"

priors_global: #str for the type and a list of values for the parameters of the prior
  #HALO TRIXIAL
  m_Triaxial_halo:
    type: uniform
    prior_parameters: [5.e10, 2.5e12]
  r_Triaxial_halo:
    type: uniform
    prior_parameters: [5.0, 50.0]
  q1_Triaxial_halo:
    type: identity
    prior_parameters: [1.0]
  q2_Triaxial_halo:
    type: uniform
    prior_parameters: [0.5, 1.5]
  #HALO TWOPOWER TRIAXIAL
  rho_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [1.e7, 1.5e8]
  a_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [1.0, 100.0]
  b_TwoPowerTriaxial_halo:
    type: identity
    prior_parameters: [1.0]
  c_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [0.0, 6.0]
  alpha_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [0.0, 2.0]
  beta_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [2.0, 6.0]
  #THIN AND THICK DISK
  rho_thin_disk:
    type: uniform
    prior_parameters: [0.5e9, 2.0e9]
  hr_thin_disk:
    type: normal
    prior_parameters: [2.6, 0.5]
  hz_thin_disk:
    type: normal
    prior_parameters: [0.3, 0.05]
  rho_thick_disk:
    type: uniform
    prior_parameters: [0.0, 1.5e9]
  hr_thick_disk:
    type: normal
    prior_parameters: [2.0, 0.2]
  hz_thick_disk:
    type: normal
    prior_parameters: [0.9, 0.18]
  #BULGE
  m_bulge:
    type: identity
    prior_parameters: [4501365375.06545]
  alpha_bulge:
    type: identity
    prior_parameters: [1.8]
  r_bulge:
    type: identity
    prior_parameters: [1.9]

