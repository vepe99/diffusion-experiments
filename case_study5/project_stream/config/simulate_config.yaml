base_dir: "/export/home/vgiusepp/diffusion-experiments/case_study5/project_stream/data/streams"
data_dir: "data_agama/"
simulator: "agama" #odisseo, gala, galax, StreaMax, agama
n_simulations: [0, 60000] #1
# n_simulations: [66_000, 100_000] #3
# n_simulations: [50_000, 100_000] #2
# n_simulations: [0, 100_000] #3
batch_size: 512
use_rotated_halo: False #only for gala
use_flattened_halo: False #only for galax
use_SCF: False #only for gala

parameters_global:
  - "a"
parameters_local:
  - "a"

pretty_parameters_global:
  - "a"
pretty_parameters_local:
  - "a"

priors_global: #str for the type and a list of values for the parameters of the prior
  #HALO TWOPOWER TRIAXIAL
  # m_TwoPowerTriaxial_halo:
  #   type: uniform
  #   prior_parameters: [0.5e12, 3e12]
  rho_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [0.5e8, 1.5e8]
  gamma_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [0.0, 2.0]
  a_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [1.0, 50.0]
  beta_TwoPowerTriaxial_halo:
    # type: uniform
    # prior_parameters: [2.0, 6.0]
    type: identity
    prior_parameters: [3.0]
  q_TwoPowerTriaxial_halo:
    type: uniform
    prior_parameters: [0.5, 1.5]
  #THIN AND THICK DISK
  rho_thin_disk:
    type: uniform
    prior_parameters: [0.5e9, 2.0e9]
  hr_thin_disk:
    type: normal
    prior_parameters: [2.6, 0.5]
  hz_thin_disk:
    type: normal
    prior_parameters: [0.3, 0.05]
  rho_thick_disk:
    type: uniform
    prior_parameters: [1.0e5, 1.5e9]
  hr_thick_disk:
    type: normal
    prior_parameters: [2.0, 0.2]
  hz_thick_disk:
    type: normal
    prior_parameters: [0.9, 0.18]
  #BULGE 
  rho_bulge:
    type: uniform
    prior_parameters: [5.0e10, 14.0e10]
  alpha_bulge:
    type: identity
    prior_parameters: [1.8]
  a_bulge:
    type: identity
    prior_parameters: [2.1]
  h_bulge:
    type: identity
    prior_parameters: [0.075]
  q_bulge:
    type: identity
    prior_parameters: [0.5]

  #DISK
  r_Disk:
    type: normal
    prior_parameters: [2.6, 0.5]
  z_Disk:
    type: normal  
    prior_parameters: [0.3, 0.05]
  Sigma_Disk:
    type: uniform
    prior_parameters: [0.5e9, 2.0e9]

